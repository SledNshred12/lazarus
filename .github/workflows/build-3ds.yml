name: Build 3DS app

# Builds the Nintendo 3DS / 2DS homebrew version (3ds/ folder) into lazarus3ds.3dsx
# and publishes it to the release tagged 3ds-latest. Does not touch the web game or the APK.
on:
  push:
    branches: [ main ]
    paths: [ '3ds/**', '.github/workflows/build-3ds.yml' ]
  workflow_dispatch:

concurrency:
  group: build-3ds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: 3ds
        run: make && make -C test
      - uses: actions/upload-artifact@v4
        with:
          name: lazarus3ds
          path: 3ds/lazarus3ds.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: cia-inputs
          path: |
            3ds/lazarus3ds.elf
            3ds/lazarus3ds.smdh
            3ds/romfs
            3ds/test/t1.elf
            3ds/test/t2.elf
            3ds/test/t3.elf
            3ds/test/t1.smdh
            3ds/test/t2.smdh
            3ds/test/t3.smdh

  cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cia-inputs
          path: 3ds
      - name: Build CIA
        working-directory: 3ds
        run: |
          curl -sL https://api.github.com/repos/3DSGuy/Project_CTR/releases/latest | grep browser_download_url | grep -i 'makerom.*ubuntu' | head -1 | cut -d'"' -f4 > mk.url
          curl -sL "$(cat mk.url)" -o mk.zip && unzip -o -q mk.zip -d mk && find mk -name makerom -exec cp {} ./makerom \; && chmod +x makerom
          docker pull minionguyjpro/bannertool:latest
          docker image inspect minionguyjpro/bannertool --format 'ep={{.Config.Entrypoint}} cmd={{.Config.Cmd}}'
          id=$(docker create minionguyjpro/bannertool) && docker cp $id:/usr/bin/bannertool ./bannertool && docker rm $id && chmod +x bannertool
          sudo dpkg --add-architecture i386 && sudo apt-get update -qq && sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 libgcc-s1:i386 >/dev/null
          ./bannertool makebanner -i banner.png -a audio.wav -o banner.bnr
          ls -la banner.bnr
          for n in 1 2 3; do
            id=$(printf '0xF7A%02d' $((10+n)))
            sed -e "s/Title                   : Lazarus/Title                   : LZ Test $n/" -e "s/CTR-P-LZRS/CTR-P-LZT$n/" -e "s/0xF7A10/$id/" -e "s#RootPath                : romfs#RootPath                : test/tromfs#" app.rsf > t$n.rsf
            if [ $n = 1 ]; then head -n -3 t$n.rsf > t$n.tmp && mv t$n.tmp t$n.rsf; fi
            ./makerom -f cia -o lztest$n.cia -elf test/t$n.elf -rsf t$n.rsf -icon test/t$n.smdh -banner banner.bnr -exefslogo -target t
          done
          ./makerom -f cia -o lazarus3ds.cia -elf lazarus3ds.elf -rsf app.rsf -icon lazarus3ds.smdh -banner banner.bnr -exefslogo -target t
      - uses: actions/upload-artifact@v4
        with:
          name: lazarus3ds-cia
          path: |
            3ds/lazarus3ds.cia
            3ds/lztest1.cia
            3ds/lztest2.cia
            3ds/lztest3.cia

  release:
    needs: [build, cia]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lazarus3ds
      - uses: actions/download-artifact@v4
        with:
          name: lazarus3ds-cia
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 3ds-latest
          name: Lazarus for 3DS (latest)
          body: |
            Lazarus for Nintendo 3DS / 2DS (homebrew, needs custom firmware).
            Copy lazarus3ds.3dsx into the 3ds folder on the SD card and start it from the Homebrew Launcher.
          files: |
            lazarus3ds.3dsx
            lazarus3ds.cia
            lztest1.cia
            lztest2.cia
            lztest3.cia
          make_latest: "false"
