name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the runner already ships the Android SDK, so just point Gradle at it
      - name: Find the Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties
          SDKMAN=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMAN" ]; then yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true; fi
          ls "$SDK/platforms" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Put the signing key in place
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/lazarus.jks

      - name: Build the APK
        env:
          LZ_STORE_PASS: ${{ secrets.KEY_PASS }}
          LZ_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name it properly
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Lazarus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lazarus-apk
          path: out/Lazarus.apk

      - name: Put it on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/Lazarus.apk \
            --title "Lazarus (latest)" \
            --notes "Download Lazarus.apk and open it on your Android phone. Allow installing from this source when Android asks. Needs internet the first time, then works offline."
