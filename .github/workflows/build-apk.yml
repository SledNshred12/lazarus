name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Put the signing key in place
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/lazarus.jks

      - name: Build the APK
        env:
          LZ_STORE_PASS: ${{ secrets.KEY_PASS }}
          LZ_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Name it properly
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Lazarus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lazarus-apk
          path: out/Lazarus.apk

      - name: Put it on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/Lazarus.apk \
            --title "Lazarus (latest)" \
            --notes "Download Lazarus.apk and open it on your Android phone. Allow installing from this source when Android asks. Needs internet the first time, then works offline."
